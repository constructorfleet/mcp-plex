[project]
name = "mcp-plex"
version = "2.2.37"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastmcp>=2.11.2",
  "fastapi>=0.115.0",
  "pydantic>=2.11.7",
  "plexapi>=4.17.0",
  "PyYAML>=6.0.2",
  "qdrant-client[fastembed]>=1.19.1",
  "qdrant-client[fastembed-gpu]>=1.19.1; platform_machine == 'x86_64'",
  "rapidfuzz>=3.13.0,<3.14.0",
  "scikit-learn>=1.7.1",
  "httpx>=0.27.0",
  "sentence-transformers>=2.7.0",
  "onnxruntime-gpu>=1.29.0; platform_machine == 'x86_64'",
  "torch>=2.14.1; platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "onnxruntime-cuda-12"
url = "https://aiinfra.pkgs.visualstudio.com/PublicPackages/_packaging/onnxruntime-cuda-12/pypi/simple/"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
onnxruntime-gpu = { index = "onnxruntime-cuda-12", marker = "platform_machine == 'x86_64'" }
torch = { index = "pytorch-cu126", marker = "platform_machine == 'x86_64'" }
